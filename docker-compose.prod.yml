services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional Sentry, read from the shell or a .env next to this file
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    environment:
      # Override with Docker-internal hostnames
      - DATABASE_URL=postgresql://saas:saas@postgres:5432/saas_db
      - REDIS_URL=redis://redis:6379
      - INNGEST_BASE_URL=http://inngest:8288
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Self-hosted Inngest in production mode: signed requests (the keys come
  # from .env, same values as for the app) and durable storage in its own
  # Postgres database plus Redis db 1. Published on localhost only: expose it
  # through your reverse proxy deliberately, see docs/deployment.md.
  inngest:
    image: inngest/inngest:v1.53.0 # keep in sync with inngest-cli in package.json
    command: >
      inngest start --host 0.0.0.0
      --event-key ${INNGEST_EVENT_KEY:?Set INNGEST_EVENT_KEY in .env}
      --signing-key ${INNGEST_SIGNING_KEY:?Set INNGEST_SIGNING_KEY in .env}
      --postgres-uri postgres://saas:saas@postgres:5432/inngest_db
      --redis-uri redis://redis:6379/1
      -u http://app:3000/api/inngest
    ports:
      - "127.0.0.1:8288:8288"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate Inngest database on the first start of an empty volume
      - ./docker/inngest-init.sql:/docker-entrypoint-initdb.d/inngest-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
